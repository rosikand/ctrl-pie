[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ctrl-pi"
version = "0.1.0"
description = "Self-hosted robot-learning console for YAM arms"
requires-python = ">=3.11"
dependencies = [
  "alembic>=1.13,<2",
  "av>=15,<16",
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "huggingface-hub>=0.34.2,<0.36",
  "lerobot==0.4.4",
  "lerobot-robot-yam==0.1.1",
  "lerobot-teleoperator-yam-gello==0.1.1",
  "modal==1.5.4",
  "numpy>=1.26,<3",
  "pillow>=10,<13",
  "psycopg[binary]>=3.2,<4",
  "pyarrow>=15,<26",
  "pydantic-settings>=2.6,<3",
  "sqlalchemy>=2.0,<3",
  "uvicorn[standard]>=0.32,<1",
  "websockets>=14,<18",
  "yam-common==0.1.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "pytest-asyncio>=0.24,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
